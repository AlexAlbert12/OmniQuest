# Supabase local development configuration for OmniQuest.
# Generated from a reviewed baseline instead of storing supabase/.temp state.
# Run `supabase start` from the project root to use this configuration.

project_id = "omniquest"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326
admin_email = "admin@omniquest.local"
sender_name = "OmniQuest Local"

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "http://localhost:8081",
  "http://127.0.0.1:8081",
  "http://localhost:8081/update-password",
  "http://127.0.0.1:8081/update-password",
  "http://localhost:19006",
  "http://127.0.0.1:19006",
  "exp://localhost:8081",
  "omniquest://",
  "omniquest://update-password"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = false
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"


[auth.rate_limit]
# Local parity with the public authentication UX. Production values must be
# mirrored in Authentication -> Rate Limits in the Supabase dashboard.
email_sent = 3
sms_sent = 30
anonymous_users = 10
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 1800

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your OmniQuest code is {{ .Code }}"
max_frequency = "5s"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = true
port = 54327
backend = "postgres"

[functions.process-notification-delivery]
verify_jwt = false

[functions.process-teacher-digests]
verify_jwt = false

[functions.cleanup-question-media]
verify_jwt = false

[functions.auth-attempt-guard]
verify_jwt = false
