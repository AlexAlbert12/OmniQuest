appId: com.alexalbert.omniquest
name: Teacher UI capture matrix
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "landing-login"
    timeout: 30000
- tapOn:
    id: "landing-login"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 15000

- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_TEACHER_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_TEACHER_PASSWORD}
- hideKeyboard

- scrollUntilVisible:
    element:
      id: "login-submit"
    direction: DOWN
    timeout: 10000

- assertVisible:
    id: "login-submit"

- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "teacher-nav-classes"
    timeout: 30000
- takeScreenshot:
    path: ui-teacher-home
- tapOn:
    id: "teacher-nav-classes"
- extendedWaitUntil:
    visible: "Cursos|Courses"
    timeout: 15000
- takeScreenshot:
    path: ui-teacher-courses
- tapOn:
    id: "teacher-nav-students"
- takeScreenshot:
    path: ui-teacher-students
- tapOn:
    id: "teacher-nav-reviews"
- takeScreenshot:
    path: ui-teacher-reviews
- tapOn:
    id: "teacher-nav-more"
- assertVisible: "Más|More"
- takeScreenshot:
    path: ui-teacher-more
- tapOn:
    id: "teacher-more-profile"
- takeScreenshot:
    path: ui-teacher-profile
- tapOn:
    id: "teacher-nav-more"
- tapOn:
    id: "teacher-more-settings"
- takeScreenshot:
    path: ui-teacher-settings
- tapOn:
    id: "teacher-nav-more"
- tapOn:
    id: "teacher-more-security"

- extendedWaitUntil:
    visible: "Seguridad|Security"
    timeout: 15000

- takeScreenshot:
    path: ui-teacher-security
- tapOn:
    id: "teacher-nav-more"
- tapOn:
    id: "teacher-more-audit"
- takeScreenshot:
    path: ui-teacher-audit
- tapOn:
    id: "teacher-nav-more"
- tapOn:
    id: "teacher-more-notifications"
- takeScreenshot:
    path: ui-teacher-notifications
- tapOn:
    id: "teacher-nav-more"

- scrollUntilVisible:
    element:
      id: "teacher-more-help"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 90
    centerElement: true

- tapOn:
    id: "teacher-more-help"

- extendedWaitUntil:
    visible: "Centro de ayuda|Help center"
    timeout: 15000

- takeScreenshot:
    path: ui-teacher-help
