appId: com.alexalbert.omniquest
name: Admin UI capture matrix
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "landing-login"
    timeout: 30000
- tapOn:
    id: "landing-login"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 15000

- tapOn:
    id: "login-email"

- inputText: ${MAESTRO_ADMIN_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_ADMIN_PASSWORD}
- hideKeyboard

- scrollUntilVisible:
    element:
      id: "login-submit"
    direction: DOWN
    timeout: 10000

- assertVisible:
    id: "login-submit"

- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "admin-nav-users"
    timeout: 30000
- takeScreenshot:
    path: ui-admin-home
- tapOn:
    id: "admin-nav-users"
- assertVisible: "Usuarios|Users"
- takeScreenshot:
    path: ui-admin-users
- tapOn:
    id: "admin-nav-content"
- assertVisible: "Contenido|Content"
- takeScreenshot:
    path: ui-admin-content
- tapOn:
    id: "admin-nav-audit"
- assertVisible: "Auditoría|Audit"
- takeScreenshot:
    path: ui-admin-audit
- tapOn:
    id: "admin-nav-more"
- assertVisible: "Más|More"
- takeScreenshot:
    path: ui-admin-more
- runFlow:
    when:
      visible:
        id: "admin-hub-support"
    commands:
      - tapOn:
          id: "admin-hub-support"
      - takeScreenshot:
          path: ui-admin-support
      - tapOn:
          id: "admin-nav-more"
- runFlow:
    when:
      visible:
        id: "admin-hub-push"
    commands:
      - tapOn:
          id: "admin-hub-push"
      - takeScreenshot:
          path: ui-admin-push
      - tapOn:
          id: "admin-nav-more"
- runFlow:
    when:
      visible:
        id: "admin-hub-exports"
    commands:
      - tapOn:
          id: "admin-hub-exports"
      - takeScreenshot:
          path: ui-admin-exports
      - tapOn:
          id: "admin-nav-more"
- runFlow:
    when:
      visible:
        id: "admin-hub-permissions"
    commands:
      - tapOn:
          id: "admin-hub-permissions"
      - takeScreenshot:
          path: ui-admin-permissions
      - tapOn:
          id: "admin-nav-more"
- runFlow:
    when:
      visible:
        id: "admin-hub-profile"
    commands:
      - tapOn:
          id: "admin-hub-profile"
      - takeScreenshot:
          path: ui-admin-profile
      - tapOn:
          id: "admin-nav-more"
- scrollUntilVisible:
    element:
      id: "admin-hub-security"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 90
    centerElement: true

- tapOn:
    id: "admin-hub-security"

- extendedWaitUntil:
    visible: "Seguridad administrativa"
    timeout: 15000

- takeScreenshot:
    path: ui-admin-security
