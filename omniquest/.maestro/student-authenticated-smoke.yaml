appId: com.alexalbert.omniquest
name: Student authenticated navigation smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "landing-login"
    timeout: 30000
- tapOn:
    id: "landing-login"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 15000
- inputText: ${MAESTRO_STUDENT_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_STUDENT_PASSWORD}
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "student-nav-classes"
    timeout: 30000
- tapOn:
    id: "student-nav-classes"
- assertVisible: "Mis cursos|My courses"
