appId: com.alexalbert.omniquest
name: Public login validation smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "landing-login"
    timeout: 30000
- tapOn:
    id: "landing-login"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 15000
- assertVisible:
    id: "login-password"
- tapOn:
    id: "login-submit"
- assertVisible:
    text: "Introduce un correo electrónico válido.|Enter a valid email address."
- assertVisible:
    text: "Introduce tu contraseña.|Enter your password."